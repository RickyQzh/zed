# Product-area pins for Semantic Map Phase A dogfood on this checkout.
# Only `crates/<package>` paths that exist as workspace members are listed.
# Unlisted crates are clustered into `other` (or a few package-name prefix groups).

[subsystems.gpui-ui]
members = [
    "crates/gpui",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_tokio",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/ui",
    "crates/ui_input",
    "crates/ui_macros",
    "crates/ui_prompt",
    "crates/theme",
    "crates/theme_extension",
    "crates/theme_importer",
    "crates/theme_selector",
    "crates/theme_settings",
    "crates/syntax_theme",
    "crates/icons",
]
summary = "GPU-accelerated UI framework, components, and theming"

